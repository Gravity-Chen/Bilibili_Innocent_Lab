name: Verify Advanced

on:
  push:
    branches: [Advanced]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advanced-verify-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_COMPILE_SDK: '37'
  CI_BUILD_TOOLS: '37.0.0'
  CI_GRADLE_JVMARGS: '-Xmx6144m -Dfile.encoding=UTF-8'
  JDK_JAVA_OPTIONS: '-XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=512m -XX:+UseCodeCacheFlushing'

jobs:
  verify:
    if: github.ref == 'refs/heads/Advanced'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Bilibili_Innocent_Lab
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-provider: basic
          # Only the trusted branch in the owning repository may populate this cache.
          cache-read-only: ${{ github.repository != 'jichuo1/Bilibili_Innocent_Lab' || github.ref != 'refs/heads/Advanced' }}
      - name: Probe exact Android SDK packages
        id: sdk
        working-directory: .
        run: python3 .github/release-templates/android_sdk_probe.py --build-tools "$CI_BUILD_TOOLS" --platform android-37.0 --github-output "$GITHUB_OUTPUT" --github-env "$GITHUB_ENV"
      - uses: android-actions/setup-android@v4.0.4
        if: steps.sdk.outputs.ready != 'true'
        with:
          packages: platform-tools
      - name: Install Android SDK
        if: steps.sdk.outputs.ready != 'true'
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Require exact Android SDK packages
        working-directory: .
        run: python3 .github/release-templates/android_sdk_probe.py --build-tools "$CI_BUILD_TOOLS" --platform android-37.0 --require-ready --github-env "$GITHUB_ENV"
      - name: Build, test, lint and validate release minification
        id: build
        working-directory: .
        run: python3 .github/release-templates/run_gradle_gates.py --project-root Bilibili_Innocent_Lab --compile-sdk "$CI_COMPILE_SDK" --jvmargs="$CI_GRADLE_JVMARGS"
      - name: Preserve behavior and contract reports
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: advanced-all-tests-${{ github.sha }}
          retention-days: 14
          path: |
            Bilibili_Innocent_Lab/app/build/reports/tests/testDebugUnitTest/
            Bilibili_Innocent_Lab/app/build/test-results/testDebugUnitTest/
      - name: Upload verification reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: advanced-verification-${{ github.sha }}
          retention-days: 14
          path: |
            Bilibili_Innocent_Lab/app/build/reports/
            Bilibili_Innocent_Lab/app/build/test-results/
      - name: Upload debug APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: advanced-debug-${{ github.sha }}
          retention-days: 14
          path: Bilibili_Innocent_Lab/app/build/outputs/apk/debug/app-debug.apk
